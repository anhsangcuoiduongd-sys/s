<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Merry Christmas 🎄</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
/* ===== PRELOADER ===== */
#preloader {
  position: fixed;
  inset: 0;
  background-color:#c62828;
  z-index:9999999;
}

.spinner {
  position:absolute;
  left:50%;
  top:50%;
  width: 50px;
  height: 30px;
  margin-left:-25px;
}

.spinner > div {
  background-color: #fff;
  height: 100%;
  width: 6px;
  display: inline-block; 
  animation: stretchdelay 1.2s infinite ease-in-out;
}

.spinner .rect2 { animation-delay: -1.1s; }
.spinner .rect3 { animation-delay: -1.0s; }
.spinner .rect4 { animation-delay: -0.9s; }
.spinner .rect5 { animation-delay: -0.8s; }

@keyframes stretchdelay {
  0%, 40%, 100% { transform: scaleY(0.4); }  
  20% { transform: scaleY(1.0); }
}

/* ===== BACKGROUND ===== */
#bg{
  position: fixed;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1512389142860-9c449e58a543");
  background-size: cover;
  background-position: center;
  filter: blur(4px);
  opacity: .85;
  z-index: 0;
}

/* ===== SNOW ===== */
.snow {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 18px;
  user-select: none;
  animation: fall linear infinite;
  z-index: 3;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

/* ===== CONTENT ===== */
.content {
  position: relative;
  z-index: 4;
  text-align: center;
  color: white;
  padding-top: 14vh;
}

h1 {
  font-family: 'Pacifico';
  font-size: 75px;
  margin-bottom: 20px;
}

p {
  font-size: 22px;
  max-width: 650px;
  margin: auto;
  line-height: 1.6;
}

/* ===== BUTTONS ===== */
button {
  position: absolute;
  padding: 12px 26px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

#yes {
  left: 65%;
  top: 45vh;
  background: #fff;
  color: #c62828;
}

#no {
  left: 30%;
  top: 45vh;
  background: #ffebee;
  color: #c62828;
}

button:hover {
  transform: scale(1.1);
}

@media (max-width: 500px) {
  h1 { font-size: 45px; }
  p { font-size: 16px; padding: 0 15px; }
  #yes { left: 55%; }
  #no { left: 10%; }
}
</style>
</head>

<body>

<!-- PRELOADER -->
<div id="preloader">
  <div class="spinner">
    <div></div><div class="rect2"></div><div class="rect3"></div>
    <div class="rect4"></div><div class="rect5"></div>
  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="bg"></div>

<div class="content">
  <h1>🎄 Merry Christmas 🎄</h1>
  <p>
    Noel tới rồi đó Đạt.  
    Có muốn nghe người ta nói thật không? 😏
  </p>

  <button id="no">Thôi khỏi 😶</button>
  <button id="yes">Nghe thử 👀</button>
</div>

<script>
/* ===== PRELOADER + MUSIC ===== */
window.onload = () => {
  setTimeout(() => {
    document.getElementById("preloader").style.display = "none";
    document.getElementById("music").play();
  }, 1500);
};

/* ===== KHEN ĐẠT ĐẸP TRAI ===== */
const compliments = [
  "🎄 Nói thật nhé Đạt, Noel này nhìn đẹp trai ghê.",
  "Không biết do tuyết hay do Đạt mà thấy sáng hẳn lên.",
  "Ừ thì… Đạt đúng là có nét đó 😌",
  "Noel lạnh vậy mà nhìn Đạt vẫn thấy ấm.",
  "Thôi khen nhỏ thôi, chứ Đạt mà tự tin là mệt lắm 😏"
];

document.getElementById("yes").onclick = () => {
  alert(compliments[Math.floor(Math.random() * compliments.length)]);
};

/* ===== NÚT CHẠY TRỐN ===== */
const noBtn = document.getElementById("no");
noBtn.onmouseover = () => {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
};

/* ===== SNOW EFFECT ===== */
function createSnow() {
  const snow = document.createElement("div");
  snow.className = "snow";
  snow.innerHTML = "❄";
  snow.style.left = Math.random() * window.innerWidth + "px";
  snow.style.animationDuration = (3 + Math.random() * 5) + "s";
  snow.style.opacity = Math.random();
  snow.style.fontSize = (12 + Math.random() * 18) + "px";
  document.body.appendChild(snow);

  setTimeout(() => {
    snow.remove();
  }, 8000);
}

setInterval(createSnow, 200);
</script>

</body>
</html>
